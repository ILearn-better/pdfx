<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pdfx · PDF 编辑器</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>pdfx</div>

  <div class="group">
    <button class="btn" id="btn-open" title="打开已有 PDF">打开</button>
    <button class="btn" id="btn-new" title="新建一份独立文档">新建</button>
    <button class="btn" id="btn-insert-pdf" title="把另一个 PDF 的页面插入当前文档">插入PDF</button>
    <button class="btn" id="btn-save" title="保存 (Ctrl+S)">保存</button>
    <button class="btn ghost" id="btn-undo" title="撤销 (Ctrl+Z)">撤销</button>
  </div>

  <div class="divider"></div>

  <div class="group tools" id="tools">
    <button class="tool active" data-tool="select" title="选择 / 编辑 (V)">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20 5 3z"/></svg><span>选择</span>
    </button>
    <button class="tool" data-tool="text" title="插入文本框 (T)">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M12 5v14M8 19h8" fill="none" stroke-width="2"/></svg><span>文本</span>
    </button>
    <button class="tool" data-tool="draw" title="手写 (P)">
      <svg viewBox="0 0 24 24"><path d="M3 20l4-1 11-11-3-3L4 16l-1 4z" fill="none" stroke-width="2"/></svg><span>画笔</span>
    </button>
    <button class="tool" data-tool="erase" title="橡皮擦 (E)：拖过笔迹即可擦掉，页面原有文字与图片不受影响">
      <svg viewBox="0 0 24 24"><path d="M4 16l8-8 6 6-4 4H8l-4-2z" fill="none" stroke-width="2"/><path d="M6 20h14" fill="none" stroke-width="2"/></svg><span>橡皮</span>
    </button>
    <button class="tool" data-tool="image" title="插入图片：选完直接放到页面中央，再拖手柄调整 (I)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke-width="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke-width="2"/></svg><span>图片</span>
    </button>
    <button class="tool" data-tool="pan" title="拖动页面 (H)">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" fill="none" stroke-width="2"/><path d="M8 7l4-4 4 4M8 17l4 4 4-4M7 8L3 12l4 4M17 8l4 4-4 4" fill="none" stroke-width="1.6"/></svg><span>拖动</span>
    </button>
  </div>

  <div class="divider"></div>

  <div class="searchbox">
    <input id="q" type="search" placeholder="全文检索（自动 OCR）…" autocomplete="off" />
    <button class="btn ghost" id="btn-search">检索</button>
  </div>

  <div class="spacer"></div>

  <div class="group viewswitch" id="viewswitch">
    <button class="btn icon vbtn active" data-view="single" title="单页（上下滚动查看当前页）">
      <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="btn icon vbtn" data-view="cont" title="连续（上下滚动翻页）">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="1" fill="none" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="1" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="btn icon vbtn" data-view="horiz" title="横向（左右滚动翻页）">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1" fill="none" stroke-width="2"/><rect x="13" y="4" width="7" height="16" rx="1" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="btn icon vbtn" id="btn-showtext" title="显示文本块边界">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1" fill="none" stroke-width="1.8"/><rect x="3" y="11" width="13" height="4" rx="1" fill="none" stroke-width="1.8"/><rect x="3" y="17" width="16" height="3" rx="1" fill="none" stroke-width="1.8"/></svg>
    </button>
  </div>

  <div class="group zoom">
    <button class="btn icon" id="zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button class="btn icon" id="zoom-in">+</button>
  </div>
  <div class="ocr-badge" id="ocr-badge" title="OCR 引擎状态">OCR</div>
</header>

<div class="stale-bar" id="stale-bar" hidden>
  <b>服务端还是旧版本</b>，这次的改动（橡皮只擦笔迹、OCR 手动触发、图片删除修复）不会生效。
  请关掉启动脚本的黑色窗口，重新双击 <code>启动PDF工具.bat</code>（会问是否换新版本），再刷新本页。
</div>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-sec">
      <div class="side-head">
        <span>文档</span>
        <span class="muted" id="doc-count">0</span>
      </div>
      <div class="doclist" id="doclist"></div>
    </div>

    <div class="side-sec grow">
      <div class="side-head">
        <span>页面</span>
        <span class="muted"><b id="page-now">0</b> / <span id="page-count">0</span></span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="side-foot">
      <button class="btn small" id="btn-add-page">+ 添加页</button>
      <button class="btn small ghost" id="btn-del-page">删除本页</button>
    </div>
  </aside>

  <section class="stage-wrap" id="stage-wrap">
    <div class="pages" id="pages">
      <div class="empty-state" id="empty-hint">
        <h2>打开或新建一份 PDF</h2>
        <p>点左上角「打开」选文件，或直接把 PDF 拖进这个窗口。</p>
        <div class="empty-actions">
          <button class="btn primary" id="btn-empty-open">打开 PDF</button>
          <button class="btn" id="btn-empty-new">新建空白文档</button>
        </div>
      </div>
    </div>
    <div class="floatbar" id="floatbar"></div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="tabs">
      <button class="tab active" data-tab="objects">对象</button>
      <button class="tab" data-tab="props">属性</button>
      <button class="tab" data-tab="results">结果</button>
    </div>

    <div class="tabpane active" id="pane-objects">
      <div class="pane-head">
        <span id="page-type" class="pill">—</span>
        <button class="btn small ghost" id="btn-ocr" title="识别本页文字（扫描件才需要，约 1~3 秒）">识别本页</button>
      </div>
      <div class="objlist" id="objlist"></div>
    </div>

    <div class="tabpane" id="pane-props">
      <div id="props"></div>
    </div>

    <div class="tabpane" id="pane-results">
      <div class="pane-head"><span id="result-count" class="muted">未检索</span></div>
      <div class="objlist" id="results"></div>
    </div>
  </aside>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><span id="modal-title">标题</span><button class="btn icon ghost" id="modal-x">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="application/pdf" hidden />
<input type="file" id="img-input" accept="image/*" hidden />
<input type="file" id="pdf-input" accept="application/pdf" hidden />
<script src="/static/app.js"></script>
</body>
</html>
