<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pdfx · PDF 编辑器</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <!-- 左段可横滚：窗口窄时品牌/菜单/工具/搜索可以滚，右段的视图·缩放·OCR 永远留在可视区 -->
  <div class="tb-left">
  <div class="brand"><span class="dot"></span>pdfx</div>

  <nav class="menubar" id="menubar">
    <div class="menu" data-menu="file">
      <button class="menu-btn" aria-haspopup="true" aria-expanded="false" title="新建 / 打开 / 保存 / 插入 / 撤销">文件</button>
      <div class="menu-pop" role="menu">
        <button class="mi" role="menuitem" id="btn-new"><span class="mi-t">新建空白文档</span><kbd>Ctrl N</kbd></button>
        <button class="mi" role="menuitem" id="btn-open"><span class="mi-t">打开 PDF…</span><kbd>Ctrl O</kbd></button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-save"><span class="mi-t">保存</span><kbd>Ctrl S</kbd></button>
        <button class="mi" role="menuitem" id="btn-saveas"><span class="mi-t">另存为…</span></button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-insert-pdf">
          <span class="mi-t">插入其他 PDF 的页面…</span><span class="mi-mark"></span>
        </button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-undo"><span class="mi-t">撤销</span><kbd>Ctrl Z</kbd></button>
      </div>
    </div>

    <div class="menu" data-menu="feat">
      <button class="menu-btn" aria-haspopup="true" aria-expanded="false" title="分割导出 / OCR / 页面 / 快捷键">功能</button>
      <div class="menu-pop" role="menu">
        <button class="mi" role="menuitem" id="btn-split">
          <span class="mi-t">分割导出…
            <span class="mi-sub">按页码范围 / 每 N 页 / 目录拆成多个 PDF</span>
          </span><span class="mi-mark"></span>
        </button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-ocr-menu">
          <span class="mi-t">本页 OCR 识别</span><span class="mi-state" id="mi-ocr-state">关闭</span>
        </button>
        <button class="mi" role="menuitem" id="btn-showtext">
          <span class="mi-t">显示文本块边界</span><span class="mi-mark"></span>
        </button>
        <button class="mi" role="menuitem" id="btn-inspector-menu">
          <span class="mi-t">对象 / 属性面板</span><kbd>Ctrl B</kbd><span class="mi-mark"></span>
        </button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-add-page"><span class="mi-t">添加一页</span><span class="mi-mark"></span></button>
        <button class="mi danger" role="menuitem" id="btn-del-page"><span class="mi-t">删除本页</span><span class="mi-mark"></span></button>
        <div class="mi-sep"></div>
        <button class="mi" role="menuitem" id="btn-keys"><span class="mi-t">快捷键一览</span><kbd>?</kbd></button>
      </div>
    </div>
  </nav>

  <div class="divider"></div>

  <div class="group tools" id="tools">
    <button class="tool active" data-tool="select" title="选择 / 编辑 (V)">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20 5 3z"/></svg><span>选择</span>
    </button>
    <button class="tool" data-tool="text" title="插入文本框 (T)">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M12 5v14M8 19h8" fill="none" stroke-width="2"/></svg><span>文本</span>
    </button>
    <button class="tool" data-tool="draw" title="手写 (P)">
      <svg viewBox="0 0 24 24"><path d="M3 20l4-1 11-11-3-3L4 16l-1 4z" fill="none" stroke-width="2"/></svg><span>画笔</span>
    </button>
    <button class="tool" data-tool="erase" title="橡皮擦 (E)：拖过笔迹即可擦掉，页面原有文字与图片不受影响">
      <svg viewBox="0 0 24 24"><path d="M4 16l8-8 6 6-4 4H8l-4-2z" fill="none" stroke-width="2"/><path d="M6 20h14" fill="none" stroke-width="2"/></svg><span>橡皮</span>
    </button>
    <button class="tool" data-tool="image" title="插入图片 (I)：也可以直接 Ctrl+V 粘贴剪贴板里的图，或把图片文件拖进窗口">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke-width="2"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke-width="2"/></svg><span>图片</span>
    </button>
    <button class="tool" data-tool="pan" title="拖动页面 (H)">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" fill="none" stroke-width="2"/><path d="M8 7l4-4 4 4M8 17l4 4 4-4M7 8L3 12l4 4M17 8l4 4-4 4" fill="none" stroke-width="1.6"/></svg><span>拖动</span>
    </button>
  </div>

  <div class="divider"></div>

  <div class="searchbox">
    <input id="q" type="search" placeholder="全文检索（自动 OCR）…" autocomplete="off" />
    <button class="btn ghost" id="btn-search">检索</button>
  </div>
  </div>

  <div class="tb-right">
  <div class="group viewswitch" id="viewswitch">
    <button class="btn icon vbtn active" data-view="single" title="单页（上下滚动查看当前页）">
      <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="btn icon vbtn" data-view="cont" title="连续（上下滚动翻页）">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="1" fill="none" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="1" fill="none" stroke-width="2"/></svg>
    </button>
    <button class="btn icon vbtn" data-view="horiz" title="横向（左右滚动翻页）">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1" fill="none" stroke-width="2"/><rect x="13" y="4" width="7" height="16" rx="1" fill="none" stroke-width="2"/></svg>
    </button>
  </div>

  <div class="group zoom">
    <button class="btn icon" id="zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button class="btn icon" id="zoom-in">+</button>
  </div>
  <button class="btn icon" id="btn-inspector" title="收起 / 展开右侧面板 (Ctrl+B)" aria-expanded="true">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 4v16" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
  </button>
  <button class="btn ocr-toggle" id="btn-ocr-top" title="扫描件没有文字层：点一下识别本页文字（约 1~3 秒）">本页 OCR 关</button>
  <div class="ocr-badge" id="ocr-badge" title="OCR 引擎状态">OCR</div>
  </div>
</header>

<div class="stale-bar" id="stale-bar" hidden>
  <b>服务端还是旧版本</b>，这次的改动（Ctrl+V 粘贴图片、快捷键侧栏、橡皮只擦笔迹）不会生效。
  请关掉启动脚本的黑色窗口，重新双击 <code>启动PDF工具.bat</code>（会问是否换新版本），再刷新本页。
</div>

<main class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-sec">
      <div class="side-head">
        <span>文档</span>
        <span class="muted" id="doc-count">0</span>
      </div>
      <div class="doclist" id="doclist"></div>
    </div>

    <div class="side-sec grow">
      <div class="side-head">
        <span>页面</span>
        <span class="muted"><b id="page-now">0</b> / <span id="page-count">0</span></span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </aside>

  <section class="stage-wrap" id="stage-wrap">
    <div class="pages" id="pages">
      <div class="empty-state" id="empty-hint">
        <h2>打开或新建一份 PDF</h2>
        <p>点左上角「文件 → 打开 PDF」，或直接把 PDF 拖进这个窗口。</p>
        <div class="empty-actions">
          <button class="btn primary" id="btn-empty-open">打开 PDF</button>
          <button class="btn" id="btn-empty-new">新建空白文档</button>
        </div>
      </div>
    </div>
    <div class="floatbar" id="floatbar"></div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="tabs">
      <button class="tab active" data-tab="objects">对象</button>
      <button class="tab" data-tab="props">属性</button>
      <button class="tab" data-tab="results">结果</button>
      <button class="btn icon ghost tab-collapse" id="btn-inspector-close" title="收起面板 (Ctrl+B)">
        <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="tabpane active" id="pane-objects">
      <div class="pane-head">
        <span id="page-type" class="pill">—</span>
        <button class="btn small ghost" id="btn-ocr" title="识别本页文字（扫描件才需要，约 1~3 秒）">识别本页</button>
      </div>
      <div class="objlist" id="objlist"></div>
    </div>

    <div class="tabpane" id="pane-props">
      <div id="props"></div>
    </div>

    <div class="tabpane" id="pane-results">
      <div class="pane-head"><span id="result-count" class="muted">未检索</span></div>
      <div class="objlist" id="results"></div>
    </div>
  </aside>

  <!-- 批量分割：占用右侧同一列，打开时顶掉对象面板。
       分割要一边看页面一边填页码范围，弹窗一挡就看不见要切哪几页。 -->
  <aside class="split-panel" id="split-panel" aria-hidden="true" aria-label="批量分割" hidden>
    <div class="sp-head">
      <span class="sp-title">批量分割</span>
      <span class="sp-sub" id="sp-head-sub">页码范围 / 每 N 页 / 目录</span>
      <button class="btn icon ghost" id="sp-close" title="收起分割面板，回到对象面板">
        <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="sp-body" id="split-body"></div>
    <div class="sp-foot" id="split-foot">
      <button class="btn" id="sp-close2">收起</button>
      <button class="btn primary" id="sp-start" disabled>开始分割</button>
    </div>
  </aside>

  <aside class="keys-panel" id="keys-panel" aria-label="快捷键">
    <div class="keys-inner">
      <div class="keys-head">
        <span>快捷键</span>
        <span class="keys-sub">输入框内不生效</span>
        <button class="btn icon ghost" id="keys-close" title="收起 (Esc)">×</button>
      </div>
      <div class="keys-body" id="keys-body"></div>
      <div class="keys-foot">按 <kbd>?</kbd> 随时开关这一栏</div>
    </div>
  </aside>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><span id="modal-title">标题</span><button class="btn icon ghost" id="modal-x">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="application/pdf" hidden />
<input type="file" id="img-input" accept="image/*" hidden />
<input type="file" id="pdf-input" accept="application/pdf" hidden />
<script src="/static/app.js"></script>
</body>
</html>
